[package]
name = "wallet-litvm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LitVM EVM sidecar (alloy). Isolated from wallet-core / BDK."

[dependencies]
alloy = { version = "1.2", default-features = false, features = [
    "std",
    "reqwest-rustls-tls",
    "providers",
    "signer-local",
    "rpc-types",
    "network",
] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
ureq = { version = "2", default-features = true, features = ["json"] }
zeroize = { version = "1", features = ["derive"] }
